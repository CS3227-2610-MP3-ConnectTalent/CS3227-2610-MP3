name: Feature request
description: Propose a bounded product change.
body:
  - type: markdown
    attributes:
      value: |
        This form records intake, not approval to implement. Human scope/design/plan approval is a later gate. Triage assigns configured labels and ownership. Do not include credentials or private applicant data.
  - type: textarea
    id: problem
    attributes:
      label: User and problem
      description: Who needs this and what problem do they face?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable improvement.
    validations:
      required: true
  - type: textarea
    id: goals
    attributes:
      label: Goals and non-goals
      description: State both included and excluded behavior.
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Affected capability IDs
      description: List canonical requirement IDs or state unknown for triage.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Give observable criteria or Given/When/Then scenarios.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and dependencies
      description: List components, dependencies and constraints.
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: Risk, security and privacy impact
      description: Consider role permissions, AI boundaries and applicant data; explain N/A.
    validations:
      required: true
  - type: textarea
    id: owner
    attributes:
      label: Student owner
      description: Name the proposed owner or state unassigned for triage.
    validations:
      required: true
