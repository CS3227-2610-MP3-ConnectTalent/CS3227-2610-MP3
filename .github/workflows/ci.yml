name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Generate Next.js types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit:coverage
      - name: CI report helper tests
        if: always()
        run: python -m unittest discover -s tests/ci -p "test_*.py" -v
      - name: Build
        run: pnpm build
      - name: Upload Vitest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports
          path: |
            test-results/vitest-junit.xml
            coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14
      # Capture job status only after the build and artifact upload have run.
      - name: Add Vitest summary
        if: always()
        run: python scripts/ci/write-vitest-summary.py
        env:
          WORKFLOW_STATUS: ${{ job.status }}
