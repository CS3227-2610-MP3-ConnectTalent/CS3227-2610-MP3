name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - name: Lint
        run: pnpm lint
      - name: Generate Next.js types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit:coverage
      - name: Add Vitest summary
        if: always()
        run: python scripts/ci/write-vitest-summary.py
      - name: Upload Vitest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-reports
          path: |
            test-results/vitest-junit.xml
            coverage/coverage-summary.json
            coverage/lcov.info
            coverage/index.html
          if-no-files-found: ignore
          retention-days: 14
      - name: Build
        run: pnpm build
