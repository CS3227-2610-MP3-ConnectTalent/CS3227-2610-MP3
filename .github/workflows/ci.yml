name: CI

on:
  pull_request:
    branches: [develop, master]
  push:
    branches: [develop, master]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true
      - name: Format check
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Generate Next.js types
        run: pnpm exec next typegen
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test:unit:coverage
      - name: CI utility tests
        if: always()
        run: python -m unittest discover -s tests/ci -p "test_*.py" -v
      - name: Build
        run: pnpm build
      - name: Upload Vitest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vitest-reports-${{ github.run_attempt }}
          path: |
            coverage/coverage-summary.json
            coverage/coverage-final.json
          if-no-files-found: ignore
          retention-days: 14
